<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Notes that burn after reading. Encrypted in your browser." />
    <title>BurnNotes</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <main class="desktop">
      <section class="window" aria-labelledby="window-title">
        <header class="title-bar">
          <h1 class="title-text" id="window-title">BurnNotes</h1>
          <a class="close" href="/" aria-label="Close">x</a>
        </header>

        <div class="window-body">
          <p class="intro">
            The text is sealed in this browser. The server keeps only the locked
            bytes, and the key never leaves this page.
          </p>

          <form id="note-form" novalidate>
            <div class="field">
              <label for="note-body">Note</label>
              <textarea
                id="note-body"
                name="note"
                rows="8"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                placeholder="Type the password, the one time code, the api key."
              ></textarea>
            </div>

            <div class="field">
              <label for="note-expiry">Expires after</label>
              <select id="note-expiry" name="ttl">
                <option value="1h">1 hour</option>
                <option value="24h" selected>24 hours</option>
                <option value="7d">7 days</option>
              </select>
            </div>

            <button type="submit" id="create-button" class="button primary">
              Encrypt &amp; Create Link
            </button>

            <p id="form-error" class="message" role="status" aria-live="polite"></p>
          </form>

          <div id="result" hidden>
            <p class="warning" role="status">
              This link works ONCE. Save it now.
            </p>

            <div class="field">
              <label for="share-link">One time link</label>
              <input
                id="share-link"
                type="text"
                readonly
                spellcheck="false"
                autocomplete="off"
              />
            </div>

            <div class="row">
              <button type="button" id="copy-button" class="button">Copy</button>
              <button type="button" id="new-button" class="button">New note</button>
            </div>
          </div>
        </div>

        <div class="status-bar">
          <span class="status-cell grow">Ready</span>
          <span class="status-cell">Notes burned: <span id="burned">000000</span></span>
        </div>

        <div class="window-footer">
          <button type="button" id="sound-toggle" class="link-button" aria-pressed="false">
            Sound: off
          </button>
          <span class="spacer"></span>
          <span class="badge">Best viewed in Netscape Navigator 4.0</span>
        </div>
      </section>
    </main>

    <script type="module" src="/assets/write.js"></script>
  </body>
</html>
